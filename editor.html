<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debatabase</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="index.css"/>
      <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header class="header">
        <h1 class="debatabase">Debatabase</h1>
    </header>
  <div class="toolbar">
    <div class="motion" id="motion" contenteditable="true">Untitled</div>
    <div class="motionType" id="motionType" contenteditable="true">Politics</div>
    <button onclick="format('bold')"><b>B</b></button>
    <button onclick="format('italic')"><i>I</i></button>
    <button onclick="format('underline')"><u>U</u></button>
    <button onclick="format('insertUnorderedList')">• List</button>
    <button onclick="format('insertOrderedList')">1. List</button>
    <button class="save-btn"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    <button class="add-comment-btn"><i class="fa-regular fa-comment"></i> Add Comment</button>
    <button class="linkable-btn"><i class="fa-solid fa-link"></i> Linkable</button>
    <button class="showlinkable-btn"><i class="fa-solid fa-eye"></i> Show Linkable</button>
    <button class="split-btn">Split</button>
    <button class="share-btn">Share</button>
  </div>

  <div class="editor-container">
        <div class="tab-display">
        </div>
    <div id="editor" class="editor" contenteditable="true">
      Start typing your document here...
    </div>
    <div class="linkable-display">
    <i class="fa-solid fa-xmark"></i>
    </div>
  </div>

  <div id="status" class="status">Saved</div>

  <script type="module"src="index.js"></script>
  <script src="https://kit.fontawesome.com/87e6eea42a.js" crossorigin="anonymous"></script>
</body>
</html>
